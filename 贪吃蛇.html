<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #game-board {
            display: grid;
            grid-template-rows: repeat(20, 20px);
            grid-template-columns: repeat(20, 20px);
            border: 1px solid #000;
        }
        /*.cell {*/
        /*    width: 20px;*/
        /*    height: 20px;*/
        /*}*/
        /*.snake {*/
        /*    background-color: green;*/
        /*}*/
        /*.food {*/
        /*    background-color: red;*/
        /*}*/
    </style>
</head>
<body>
    <div id="game-board">
        <!-- 游戏板将在这里动态生成 -->
    </div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const boardSize = 20;
        let snake = [{x: 10, y: 10}];
        let food = generateFood();
        let direction = {x: 0, y: 0}; // 初始方向为静止
        let score = 0;
        let gameInterval;

        function createBoard() {
            for (let y = 0; y < boardSize; y++) {
                for (let x = 0; x < boardSize; x++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    gameBoard.appendChild(cell);
                }
            }
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.remove('snake', 'food'));

            snake.forEach(segment => {
                const index = segment.y * boardSize + segment.x;
                cells[index].classList.add('snake');
            });

            const foodIndex = food.y * boardSize + food.x;
            cells[foodIndex].classList.add('food');
        }

        function moveSnake() {
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            if (head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize || snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                alert('游戏结束！得分：' + score);
                clearInterval(gameInterval);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                food = generateFood();
            } else {
                snake.pop();
            }

            updateBoard();
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {x: Math.floor(Math.random() * boardSize), y: Math.floor(Math.random() * boardSize)};
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            return newFood;
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    if (direction.y === 0) {
                        direction = {x: 0, y: -1};
                        startGame();
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) {
                        direction = {x: 0, y: 1};
                        startGame();
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) {
                        direction = {x: -1, y: 0};
                        startGame();
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) {
                        direction = {x: 1, y: 0};
                        startGame();
                    }
                    break;
            }
        });

        function startGame() {
            if (!gameInterval) {
                gameInterval = setInterval(moveSnake, 200);
            }
        }

        createBoard();
        updateBoard();
    </script>
</body>
</html>
